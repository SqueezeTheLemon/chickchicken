<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chickchicken · 로그인</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="site-header"><a class="logo" href="/">chickchicken</a></header>
  <main>
    <h1>로그인</h1>
    <form id="form" class="auth-form">
      <label>아이디
        <input name="username" required autocomplete="username" />
      </label>
      <label>비밀번호
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <p id="msg" class="msg"></p>
      <button class="btn" type="submit">로그인</button>
      <p class="meta">계정이 없나요? <a id="signup-link" class="accent" href="/signup">회원가입</a></p>
    </form>
  </main>

  <script type="module">
    import { send, safeNext } from '/app.js';

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    document.getElementById('signup-link').href = `/signup?next=${encodeURIComponent(safeNext())}`;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await send('POST', '/auth/login', Object.fromEntries(new FormData(form)));
        location.href = safeNext();
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
