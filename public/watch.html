<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chickchicken · 시청</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- HLS 재생: Safari 는 기본 지원, 나머지 브라우저는 hls.js 로 재생해요 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <header>
    <a class="logo" href="/">chickchicken</a>
    <nav class="row">
      <a class="btn ghost" href="/live">📱 라이브 시작</a>
      <a class="btn" href="/upload">+ 영상 등록</a>
    </nav>
  </header>
  <main id="main">
    <p id="status" class="empty">불러오는 중…</p>
  </main>

  <script type="module">
    import { api, el, formatDate, formatSize, statusBadge } from '/app.js';

    const status = document.getElementById('status');
    const id = new URLSearchParams(location.search).get('id');
    const POLL_MS = 3000;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    try {
      if (!id) throw new Error('잘못된 주소예요.');
      let b = await api(`/broadcasts/${encodeURIComponent(id)}`);
      document.title = `${b.title} · chickchicken`;

      const video = el('video', { className: 'player', controls: true, autoplay: true, playsInline: true });
      const overlay = el('div', { className: 'player-overlay', hidden: true });
      const badge = el('span');
      const notice = el('p', { className: 'notice' });
      const renderBadge = () => badge.replaceChildren(statusBadge(b));
      renderBadge();

      status.replaceWith(
        el('div', { className: 'player-wrap' }, video, overlay),
        el('h1', { style: 'margin-top:16px' }, badge, ' ', b.title),
        el('p', { className: 'meta', textContent: meta(b) }),
        notice,
        el('p', { className: 'desc', textContent: b.description || '설명이 없어요.' }),
      );

      if (b.kind === 'vod') {
        video.append(el('source', { src: b.videoUrl, type: b.mimeType }));
      } else {
        await playLive();
      }

      async function playLive() {
        // 1) 방송 직후엔 첫 조각이 만들어질 때까지 재생목록이 없어요 → 생길 때까지 기다리기
        while (!(await exists(b.videoUrl))) {
          if (b.status === 'ended') return showOverlay('송출된 영상이 없는 방송이에요.');
          showOverlay('방송 준비 중이에요…');
          await sleep(POLL_MS);
          b = await api(`/broadcasts/${b.id}`);
        }
        overlay.hidden = true;

        // 2) 재생 (방송 중이면 최신 지점부터, 종료된 방송이면 처음부터 = 다시보기)
        if (window.Hls?.isSupported()) {
          const hls = new Hls({ manifestLoadingMaxRetry: 6, levelLoadingMaxRetry: 6 });
          hls.loadSource(b.videoUrl);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = b.videoUrl;
        } else {
          return showOverlay('이 브라우저는 HLS 재생을 지원하지 않아요.');
        }
        video.play().catch(() => {}); // 자동재생이 막히면 사용자가 ▶ 를 누르면 돼요

        // 3) 방송 중이면 상태를 주기적으로 확인해서 종료를 표시
        if (b.status === 'ended') {
          notice.textContent = '종료된 라이브예요. 다시보기로 재생하고 있어요.';
          return;
        }
        notice.textContent = '실시간 방송 중이에요. (HLS 특성상 5~10초 지연될 수 있어요)';
        while (b.status === 'live') {
          await sleep(POLL_MS);
          b = await api(`/broadcasts/${b.id}`).catch(() => b);
        }
        renderBadge();
        notice.textContent = '방송이 종료됐어요. 마지막 장면까지 재생된 뒤 멈춰요. 새로고침하면 다시보기로 볼 수 있어요.';
      }

      function showOverlay(text) {
        overlay.hidden = false;
        overlay.textContent = text;
      }
    } catch (e) {
      status.className = 'error';
      status.textContent = e.message;
    }

    async function exists(url) {
      const res = await fetch(url, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
      return res?.ok ?? false;
    }

    function meta(b) {
      if (b.kind === 'vod') return `${formatDate(b.createdAt)} · ${formatSize(b.sizeBytes)}`;
      return b.endedAt ? `${formatDate(b.createdAt)} ~ ${formatDate(b.endedAt)}` : `${formatDate(b.createdAt)} 시작`;
    }
  </script>
</body>
</html>
