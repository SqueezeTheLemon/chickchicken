#cloud-config
# 6단계: OCI 인스턴스 생성 화면의 "고급 옵션 → 관리 → Cloud-init 스크립트"에 붙여 넣으면
# 처음 부팅할 때 자동으로 배포까지 해요. 아래 두 값만 바꾸세요.
#   - your-domain.example  → 구매한 도메인 (DNS A 레코드가 이 VM 공인 IP 를 가리킨 뒤에 HTTPS 가 발급돼요)
#   - you@example.com      → 인증서 만료 알림 메일
# DNS 연결 전에 부팅해도 괜찮아요. Caddy 가 DNS 가 맞춰질 때까지 인증서 발급을 재시도해요.
package_update: true
packages:
  - git
runcmd:
  - git clone --depth 1 https://github.com/SqueezeTheLemon/chickchicken.git /opt/chickchicken
  - bash /opt/chickchicken/deploy/setup-vm.sh --domain your-domain.example --email you@example.com > /var/log/chickchicken-setup.log 2>&1
